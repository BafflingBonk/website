<section class="page">
  <header class="page-header">
    <span class="eyebrow">Gallery</span>
    <h1>Art</h1>
    <p>
      Pixel art I've made, partly for my games and partly for practice. Click a piece to see it up
      close.
    </p>
  </header>

  <ul class="gallery">
    @for (artwork of artworks; track artwork.id; let index = $index) {
      <li>
        <button class="artwork" type="button" (click)="open(index)">
          <span class="frame">
            <img [src]="artwork.imageUrl" [alt]="artwork.title" loading="lazy" />
          </span>
          <span class="caption">
            <span class="title">{{ artwork.title }}</span>
            <span class="meta">{{ artwork.author }}</span>
          </span>
        </button>
      </li>
    }
  </ul>
</section>

@if (selected(); as artwork) {
  <div
    class="lightbox"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="artwork.title"
    (click)="close()"
  >
    <button #closeButton class="lightbox-close" type="button" aria-label="Close" (click)="close()">
      ✕
    </button>

    <figure (click)="$event.stopPropagation()">
      <img [src]="artwork.imageUrl" [alt]="artwork.title" />
      <figcaption>
        <strong>{{ artwork.title }}</strong>
        <span>{{ artwork.author }} · {{ artwork.createdAt | date: 'MMMM y' }}</span>
        @if (artwork.description) {
          <p>{{ artwork.description }}</p>
        }
      </figcaption>
    </figure>

    @if (artworks.length > 1) {
      <button
        class="lightbox-nav prev"
        type="button"
        aria-label="Previous artwork"
        (click)="step(-1); $event.stopPropagation()"
      >
        ‹
      </button>
      <button
        class="lightbox-nav next"
        type="button"
        aria-label="Next artwork"
        (click)="step(1); $event.stopPropagation()"
      >
        ›
      </button>
    }
  </div>
}
